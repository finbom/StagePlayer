name: Build

# Every push: build, test and smoke-test on Windows and macOS (Apple Silicon).
# A version tag (v1.2.3): also create a draft GitHub release with the installers.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            app: release/win-unpacked/StagePlayer.exe
            files: |
              release/StagePlayer-Setup-*.exe
              release/StagePlayer-*-Portable.exe
          - os: macos-latest # Apple Silicon (arm64)
            dist: dist:mac
            app: release/mac-arm64/StagePlayer.app/Contents/MacOS/StagePlayer
            files: |
              release/StagePlayer-*-mac-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no certificates yet; the Mac app is ad-hoc signed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.dist }}
      - name: Check that the Mac app is ad-hoc signed (Apple Silicon refuses unsigned apps)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/StagePlayer.app
          codesign -dv release/mac-arm64/StagePlayer.app 2>&1 | tee codesign.txt
          grep -q "Signature=adhoc" codesign.txt
      - name: Smoke test the packaged app
        run: node tests/smoke.mjs "${{ matrix.app }}"
        env:
          SMOKE_OUT: smoke-output
      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}
          path: smoke-output/
          if-no-files-found: ignore
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: SHA256 checksums
        working-directory: installers
        run: sha256sum StagePlayer-* | tee SHA256SUMS.txt
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: StagePlayer ${{ github.ref_name }}
          files: installers/*
          body: |
            ## Download

            | File | For |
            | --- | --- |
            | **StagePlayer-Setup-x.y.z.exe** | Windows: installer (no administrator rights needed) |
            | **StagePlayer-x.y.z-Portable.exe** | Windows: runs without installing, e.g. from a USB stick |
            | **StagePlayer-x.y.z-mac-arm64.dmg** | macOS on Apple Silicon (M1 or newer) |
            | **SHA256SUMS.txt** | Checksums to verify the download |

            Show files (`.stageshow`) work on both Windows and macOS.

            ### First start: "unknown publisher" warning

            The files are not yet signed with a certificate that Windows and macOS recognise, so you
            confirm the app once. Full guide with help for every case:
            **[Download and install](https://github.com/finbom/StagePlayer#download-and-install)**

            - **Windows:** "Windows protected your PC" → click **More info** → **Run anyway**.
            - **macOS:** open StagePlayer, click **Done** → **System Settings → Privacy & Security** →
              **Open Anyway**. Or in Terminal: `xattr -dr com.apple.quarantine /Applications/StagePlayer.app`

            ## Code signing policy

            Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).
            Windows releases published before code signing was approved are unsigned; Windows may then
            show "Windows protected your PC" (click **More info → Run anyway**).
