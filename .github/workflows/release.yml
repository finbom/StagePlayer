name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - name: Upload to a draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: |
            ## Download (Windows)

            - **StagePlayer-Setup-x.y.z.exe**: installer (no administrator rights needed)
            - **StagePlayer-x.y.z-Portable.exe**: runs without installing, e.g. from a USB stick

            See the [README](https://github.com/finbom/StagePlayer#readme) for how to use StagePlayer.

            ## Code signing policy

            Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).
            Releases published before code signing was approved are unsigned; Windows may then show
            "Windows protected your PC" (click **More info → Run anyway**).
          files: |
            release/StagePlayer-Setup-*.exe
            release/StagePlayer-*-Portable.exe
